<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bearly Missed · Berkeley events</title>
  <meta name="description" content="Everything happening around Berkeley — talks, parties, hackathons, free food — from Luma, Partiful, Cerebral Valley, club Instagram and calendars, and the campus calendar.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="tweaks.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <nav class="nav" aria-label="Site">
        <a href="./" aria-current="page">Events</a>
        <a href="about.html">Sources</a>
        <a href="https://github.com/vitgruib/bearly">Code</a>
      </nav>
      <h1 class="wordmark">Bearly Missed<span class="dot">.</span></h1>
      <p class="tagline">Everything happening around Berkeley, <em>in one place</em>.</p>
      <p class="report" id="report" hidden>Missing an event? <a target="_blank" rel="noopener">Tell us where it was posted</a>.</p>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="wrap">
      <div class="top">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search talks, parties, hackathons, clubs…" autocomplete="off">
        </label>
        <button class="more-btn" id="more" type="button" aria-expanded="false" aria-controls="panel">Filters<span class="badge-n" id="more-n" hidden></span></button>
      </div>
      <div class="row" id="when" role="radiogroup" aria-label="When"></div>
      <div class="row chips" id="topics" aria-label="Topics"></div>
      <div class="panel" id="panel" hidden>
        <section>
          <h3>Where</h3>
          <div class="chips wrap-chips" id="regions"></div>
        </section>
        <section>
          <h3>Cost</h3>
          <div class="chips wrap-chips"><button class="chip" id="free" type="button" aria-pressed="false">Free only</button></div>
        </section>
        <section>
          <h3>Sources <button class="link" id="all-sources" type="button">Show all</button></h3>
          <div class="menu" id="sources"></div>
        </section>
      </div>
      <div class="row meta-row">
        <div class="active" id="active"></div>
        <span class="count" id="count"></span>
      </div>
    </div>
  </div>

  <main class="wrap" id="list" aria-live="polite"></main>
  <div id="sentinel"></div>

  <footer class="wrap footer">
    <p id="updated"></p>
    <p id="status"></p>
  </footer>

  <template id="card">
    <article class="card">
      <div class="time"></div>
      <div class="body">
        <a class="title" target="_blank" rel="noopener"></a>
        <p class="where"></p>
        <p class="desc"></p>
        <div class="foot">
          <span class="badges"></span>
          <button class="ical" type="button" title="Add to calendar">+ Calendar</button>
        </div>
      </div>
      <img class="thumb" alt="" loading="lazy" decoding="async">
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
