  <div class="controls" id="controls">
    <div class="wrap">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search talks, parties, hackathons, clubs…" autocomplete="off">
      </label>
      <div class="filters">
        <div class="frow"><span class="flabel">When</span>
          <div class="fchips"><div id="when" role="radiogroup" aria-label="When"></div><span class="range" id="range" hidden><input type="date" id="from" aria-label="From"><span>to</span><input type="date" id="to" aria-label="To"></span><button class="chip" id="free" type="button" aria-pressed="false">Free only</button></div>
        </div>
        <div class="frow"><span class="flabel">Event type</span>
          <div class="fsubs">
            <div class="fchips" id="topics-0" aria-label="Tech and career event types"></div>
            <div class="fchips" id="topics-1" aria-label="Fun event types"></div>
          </div>
        </div>
        <div class="frow"><span class="flabel">Location</span><div class="fchips" id="regions" aria-label="Location"></div></div>
        <div class="frow"><span class="flabel">Source</span><div class="fchips" id="sources" aria-label="Source"></div></div>
      </div>
      <div class="meta-row">
        <p class="showing" id="showing"></p>
        <button class="link" id="clear" type="button" hidden>Clear filters</button>
        <span class="count" id="count"></span>
      </div>
    </div>
  </div>

  <main class="wrap" id="list" aria-live="polite"></main>
  <div id="sentinel"></div>

  <footer class="wrap footer">
    <p id="updated"></p>
    <p id="status"></p>
  </footer>

  <template id="card">
    <article class="card">
      <div class="time"></div>
      <div class="body">
        <a class="title" target="_blank" rel="noopener"></a>
        <p class="where"></p>
        <p class="desc"></p>
      </div>
      <div class="foot">
        <span class="badges"></span>
        <details class="addcal">
          <summary class="ical" title="Add to calendar">+ Calendar</summary>
          <div class="calmenu">
            <a class="gcal" target="_blank" rel="noopener">Google Calendar</a>
            <a class="ocal" target="_blank" rel="noopener">Outlook</a>
            <button class="ics" type="button">Apple &amp; others (.ics)</button>
          </div>
        </details>
        <a class="flag" target="_blank" rel="noopener" title="Spam, cancelled or wrong? Report it" hidden>Report</a>
      </div>
      <img class="thumb" alt="" loading="lazy" decoding="async">
    </article>
  </template>
