<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bearly Missed · Berkeley's open-source calendar</title>
  <meta name="description" content="Berkeley's open-source calendar: talks, parties, hackathons and free food from every club, department and platform, in one list anyone can add to.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="designs.css">
  <script src="tweaks.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <nav class="nav" aria-label="Site">
        <a href="./" aria-current="page">Events</a>
        <a href="about.html">Sources &amp; Code</a>
      </nav>
      <h1 class="wordmark">Bearly Missed</h1>
      <p class="tagline">Berkeley's open source event calendar</p>
      <p class="report" id="report" hidden>Missing an event? <a target="_blank" rel="noopener">Add it</a><span class="add-source" hidden>, or <a href="about.html#add-source">add your club's calendar</a></span>.</p>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="wrap">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search talks, parties, hackathons, clubs…" autocomplete="off">
      </label>
      <div class="filters">
        <div class="frow"><span class="flabel">When</span>
          <div class="fchips"><div id="when" role="radiogroup" aria-label="When"></div><span class="range" id="range" hidden><input type="date" id="from" aria-label="From"><span>to</span><input type="date" id="to" aria-label="To"></span><button class="chip" id="free" type="button" aria-pressed="false">Free only</button></div>
        </div>
        <div class="frow"><span class="flabel">Event type</span>
          <div class="fsubs">
            <div class="fchips" id="topics-0" aria-label="Tech and career event types"></div>
            <div class="fchips" id="topics-1" aria-label="Fun event types"></div>
          </div>
        </div>
        <div class="frow"><span class="flabel">Location</span><div class="fchips" id="regions" aria-label="Location"></div></div>
        <div class="frow"><span class="flabel">Source</span><div class="fchips" id="sources" aria-label="Source"></div></div>
      </div>
      <div class="meta-row">
        <p class="showing" id="showing"></p>
        <button class="link" id="clear" type="button" hidden>Clear filters</button>
        <span class="count" id="count"></span>
      </div>
    </div>
  </div>

  <main class="wrap" id="list" aria-live="polite"></main>
  <div id="sentinel"></div>

  <footer class="wrap footer">
    <p id="updated"></p>
    <p id="status"></p>
  </footer>

  <template id="card">
    <article class="card">
      <div class="time"></div>
      <div class="body">
        <a class="title" target="_blank" rel="noopener"></a>
        <p class="where"></p>
        <p class="desc"></p>
      </div>
      <div class="foot">
        <span class="badges"></span>
        <details class="addcal">
          <summary class="ical" title="Add to calendar">+ Calendar</summary>
          <div class="calmenu">
            <a class="gcal" target="_blank" rel="noopener">Google Calendar</a>
            <a class="ocal" target="_blank" rel="noopener">Outlook</a>
            <button class="ics" type="button">Apple &amp; others (.ics)</button>
          </div>
        </details>
        <a class="flag" target="_blank" rel="noopener" title="Spam, cancelled or wrong? Report it" hidden>Report</a>
      </div>
      <img class="thumb" alt="" loading="lazy" decoding="async">
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
