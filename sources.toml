[instagram]
# Needs APIFY_TOKEN. The one paid source: Apify bills ~$0.0017 per post read.
accounts_file = "clubs/instagram.txt"
accounts = []            # extra handles beyond the CalLink list
accounts_per_run = 100   # ~9 daily runs to cycle through every club
posts_per_account = 4
monthly_budget_usd = 5.0 # Apify's free plan includes $5/month
max_run_usd = 0.5

[email]
folder = "events"  # Gmail label your listserv filter applies
days_back = 14

[community]
# The no-account path (contribute.py): one Google Form to report an event or send feedback.
# Every 30 minutes new rows of its response sheet (File > Share > Publish to web > CSV) are
# filed as GitHub issues; a report waits for the `approved` label. New sources come only by
# pull request to this file.
report_prefill = "https://docs.google.com/forms/d/e/1FAIpQLSeltgT0d8IheCnsmDhdECZ347hpWNquj5A_GO-cifRQ0kldig/viewform?usp=pp_url&entry.983668865=Report+an+event&entry.1140898671=EVENT"  # Get pre-filled link: "Report an event" picked, Event answer set to EVENT
sheet_csv = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTe05uuWxv2swFmXVINuZL82MYKx6dJ8hroyT3kVgDu4TCwrd8QHG3ktN7t7WqNaKNVKCoYJwS29qCZ/pub?output=csv"

[slack]
days_back = 14
channels = []  # empty = every channel the bot has been added to
