# What the scraper pulls from. Every source runs unless `enabled = false`.
# Sources that need credentials (email, slack) skip themselves quietly until the
# env vars in README.md are set.

days_ahead = 30  # how far ahead the site lists events

[luma]
center = [37.8715, -122.2730]  # Luma's "discover" feed is ordered by distance from here
max_pages = 12
# Club / org calendars on Luma: the slug from luma.com/<slug>, or a cal-... id.
calendars = ["calmsa", "nucleate"]

[eventbrite]
places = ["ca--berkeley", "ca--oakland"]
pages = 4

[cerebral_valley]
pages = ["/events"]

[partiful]
# Public partiful.com/e/<id> links to always include (links in emails/Slack are found
# automatically).
events = []

[berkeley_calendar]
days_ahead = 21

[feeds]
# Calendars in standard formats. Each [[feeds.list]] entry:
#   type    = ics | rss | jsonld | tribe | localist | fullcalendar
#   campus  = true for department calendars whose events never mention a city
#   city    = the city to assume for a venue's calendar that never names it
#   match   = regex an event's title/venue must match (e.g. only home games)
#   exclude = regex that drops an event by title/description
#   max_repeats = drop titles that recur more often than this (daily shows, tours)

# --- Campus calendars not (fully) mirrored on events.berkeley.edu ---

[[feeds.list]]
name = "Berkeley Law"
type = "tribe"
url = "https://www.law.berkeley.edu/wp-json/tribe/events/v1/events"
campus = true

[[feeds.list]]
name = "Haas School of Business"
type = "tribe"
url = "https://haas.berkeley.edu/wp-json/tribe/events/v1/events"

[[feeds.list]]
name = "UC Botanical Garden"
type = "tribe"
url = "https://botanicalgarden.berkeley.edu/wp-json/tribe/events/v1/events"
campus = true

[[feeds.list]]
name = "CITRIS"
type = "tribe"
url = "https://citris-uc.org/wp-json/tribe/events/v1/events"
campus = true

[[feeds.list]]
name = "Center for Long-Term Cybersecurity"
type = "tribe"
url = "https://cltc.berkeley.edu/wp-json/tribe/events/v1/events"
campus = true

[[feeds.list]]
name = "Simons Institute"
type = "fullcalendar"
url = "https://simons.berkeley.edu/api/events"
campus = true
exclude = "Long-term visitor event"

[[feeds.list]]
name = "School of Information"
type = "ics"
url = "https://www.ischool.berkeley.edu/events/128/calendar.ics"
campus = true

[[feeds.list]]
name = "Cal Athletics"
type = "ics"
url = "https://calbears.com/calendar.ashx/calendar.ics?sport_id=0"
match = "berkeley|underhill|edwards|memorial stadium|haas pavilion|evans diamond|spieker|hearst|witter|levine-fricke|goldman|hellman|kleeberger"

[[feeds.list]]
name = "ASUC"
type = "ics"
url = "https://calendar.google.com/calendar/ical/calendar%40asuc.org/public/basic.ics"
campus = true

[[feeds.list]]
name = "Graduate Assembly"
type = "ics"
url = "https://calendar.google.com/calendar/ical/berkeley.edu_u7u87h8t91v03rgas6hnb76b1s%40group.calendar.google.com/public/basic.ics"
campus = true

# --- City and community ---

[[feeds.list]]
name = "Berkeley Public Library"
type = "ics"
url = "https://berkeleypubliclibrary.libnet.info/feeds?data=eyJmZWVkVHlwZSI6ImljYWwiLCJmaWx0ZXJzIjp7ImxvY2F0aW9uIjpbImFsbCJdLCJhZ2VzIjpbImFsbCJdLCJ0eXBlcyI6WyJhbGwiXSwidGFncyI6W10sInRlcm0iOiIiLCJkYXlzIjoxNH19"
city = "Berkeley"
exclude = "storytime|story time|baby|toddler|preschool|lapsit|homework help"

[[feeds.list]]
name = "BAMPFA"
type = "ics"
url = "https://bampfa.org/events/upcoming.ics"
campus = true

[[feeds.list]]
name = "Oakland Museum of California"
type = "tribe"
url = "https://museumca.org/wp-json/tribe/events/v1/events"
city = "Oakland"

[[feeds.list]]
