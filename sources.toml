[hackathons]
# Devpost, YC, MLH and AGI House; Bay Area in-person only. Devpost costs one page per
# candidate (~60), so this runs daily.
every_hours = 24
# Devpost: only open pages of hackathons starting within this many days.
days_ahead = 45

[instagram]
# Needs APIFY_TOKEN. The one paid source: Apify bills ~$0.0017 per post read.
accounts_file = "clubs/instagram.txt"
accounts = []            # extra handles beyond the CalLink list
accounts_per_run = 100   # ~9 daily runs to cycle through every club
posts_per_account = 4
monthly_budget_usd = 5.0 # Apify's free plan includes $5/month
max_run_usd = 0.5

[email]
folder = "events"  # Gmail label your listserv filter applies
days_back = 14

[slack]
days_back = 14
channels = []  # empty = every channel the bot has been added to
