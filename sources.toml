# What the scraper pulls from. Every source runs unless `enabled = false`.
# Sources that need credentials (email, slack) skip themselves quietly until the
# env vars in README.md are set.

days_ahead = 30  # how far ahead the site lists events

[luma]
center = [37.8715, -122.2730]  # Luma's "discover" feed is ordered by distance from here
max_pages = 12
# Luma discover categories, sorted by distance from `center` (cat-ai, cat-tech, cat-climate,
# cat-crypto, cat-AzVAf6VmE9JEre4 = arts, cat-fooddrink, cat-books, cat-games, ...).
categories = ["cat-ai", "cat-tech", "cat-climate", "cat-AzVAf6VmE9JEre4"]
# Calendars always followed: the slug from luma.com/<slug>, or a cal-... id. Org calendars
# that host near campus are discovered automatically and need not be listed.
calendars = [
  # Campus clubs
  "calmsa", "nucleate", "berkeleygatewayaccelerator",
  # Bay Area tech, startup and hackathon communities (checked 2026-10-27)
  "genai-sf", "build-with-ai-club", "foundersbay", "ai-sf", "9zero", "thesanfranciscotechscene",
  "Big-Brain-Bay", "sf-hackersquad", "aisafety-sf", "southparkcommons-events", "grayarea",
  "sf-hardware-meetup", "ls", "ycombinator-official", "fdotinc", "bases26_27", "tiat",
  "anyscale", "kindredventuresevents", "cal-kiKh3eJNLvQQRk6",
]

[eventbrite]
places = ["ca--berkeley", "ca--oakland"]
pages = 4

[cerebral_valley]
location = "BAY_AREA"

[partiful]
# Public partiful.com/e/<id> links to always include (links in emails/Slack are found
# automatically).
events = []

[berkeley_calendar]
days_ahead = 21

[feeds]
# Calendars in standard formats. Each [[feeds.list]] entry:
#   type    = ics | rss | jsonld | tribe | localist | fullcalendar
#   campus  = true for department calendars whose events never mention a city
#   city    = the city to assume for a venue's calendar that never names it
#   match   = regex an event's title/venue must match (e.g. only home games)
#   exclude = regex that drops an event by title/description
#   max_repeats = drop titles that recur more often than this (daily shows, tours)

