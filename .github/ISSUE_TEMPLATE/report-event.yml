name: Report an event
description: Flag an event that's spam, cancelled, or wrong. Use the Report link on the event.
title: "Report: "
labels: [report]
body:
  - type: markdown
    attributes:
      value: |
        The title names the event and its id in [brackets]; keep the id so the right event is
        hidden. No Report link handy? Paste the event's link below.
  - type: dropdown
    id: reason
    attributes:
      label: What's wrong?
      options:
        - Spam or not a real event
        - Cancelled
        - Wrong time or place
        - Duplicate
        - Not relevant to students
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: The event's link, what's wrong with it, or anything else that helps.
