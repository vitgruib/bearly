name: Community reports

# "Report an event" issues (.github/ISSUE_TEMPLATE). The maintainer's `approved` label hides the
# reported event (moderation.toml), commits it, and starts a scrape. Only people with triage
# access can add labels, so approval stays with maintainers. Sources are added only by pull
# request to sources.toml, never from an issue.
# Google Form responses (the no-account path for reports and feedback) are filed as issues every
# 30 minutes.
# Issue text is untrusted: it reaches scraper.contribute only through env vars.
on:
  issues:
    types: [labeled]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  forms:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: forms
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: File new form responses as issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m scraper.contribute forms

  approve:
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: approve  # one commit to main at a time
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Hide the event
        id: save
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: uv run python -m scraper.contribute approve
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moderation.toml
          git commit -m "Community: approve #${{ github.event.issue.number }}"
          git pull --rebase
          git push
          # Pushes made with the workflow token don't trigger workflows, so start the scrape.
          gh workflow run scrape.yml
          gh issue close ${{ github.event.issue.number }} --comment "$(cat "$RUNNER_TEMP/comment.md")"
      - name: Explain a failure
        if: failure() && steps.save.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body-file "$RUNNER_TEMP/comment.md"
