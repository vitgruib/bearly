name: Scrape and publish

on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - name: Scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          SLACK_TOKENS: ${{ secrets.SLACK_TOKENS }}
        run: uv run python -m scraper.run
      - name: Commit fresh data
        run: |
          git config user.name "bearly-bot"
          git config user.email "bearly-bot@users.noreply.github.com"
          git add site/data/events.json data/llm_cache.json
          git diff --cached --quiet || (git commit -m "data: refresh events" && git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
